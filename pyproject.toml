[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opitintyga-resumelink"
version = "0.1.0"
description = "从输入中抽取数值，计算链路断点续传相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "opitintyga" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://opitintyga.github.io"
Repository = "https://github.com/opitintyga/resumelink"
Issues = "https://github.com/opitintyga/resumelink/issues"

[project.scripts]
resumelink = "resumelink:main"

[tool.setuptools]
py-modules = ["resumelink"]
